[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback - semua route diarahkan ke index.html (React Router)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Header keamanan dasar
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Diperlukan agar Web Bluetooth / WebUSB bisa diakses (butuh HTTPS - Netlify sudah otomatis HTTPS)
    Permissions-Policy = "bluetooth=(self), usb=(self)"

# Cache asset statis lebih lama
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
